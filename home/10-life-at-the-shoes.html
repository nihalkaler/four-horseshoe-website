<!-- ==================================================================
     LIFE AT THE SHOES – rotating photo strip
     • Shows 5 photos at a time on computers (3 on tablets, 2 on phones)
       and moves along one photo every few seconds, in a new random
       order each time the page loads.
     • To ADD a photo, copy one <li class="fhc__item"> … </li> line and
       change the address in BOTH src="…" and srcset="…", plus the alt="…"
       description. To REMOVE a photo, delete its whole line.
     • To change the speed, change data-interval="3500" below
       (milliseconds – 3500 = a new photo every 3.5 seconds).
     • Every photo opens the Gallery page.
     ================================================================== -->
<style>
.fhr .fhc{--per:5;--gap:12px;margin-top:36px}
.fhr .fhc__view{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fhr .fhc__view::-webkit-scrollbar{display:none}
.fhr .fhc--js .fhc__view{overflow:hidden;overflow:clip;scroll-snap-type:none;touch-action:pan-y}
.fhr .fhc__track{display:flex;gap:var(--gap);margin:0;padding:0;list-style:none}
.fhr .fhc__item{flex:0 0 calc((100% - var(--gap) * (var(--per) - 1)) / var(--per));min-width:0;scroll-snap-align:start}
.fhr .fhc__item a{display:block;overflow:hidden;border-radius:3px;aspect-ratio:4/5;background:var(--wheat,#E7D9B4)}
.fhr .fhc__item img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.fhr .fhc__item a:hover img{transform:scale(1.05)}
.fhr .fhc__ctrl{display:none;justify-content:flex-end;align-items:center;gap:10px;margin-top:22px}
.fhr .fhc--js .fhc__ctrl{display:flex}
.fhr .fhc__btn{width:46px;height:46px;margin:0;padding:0;border-radius:50%;border:1px solid var(--ink);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,color .2s}
.fhr .fhc__btn:hover{background:var(--ink);color:var(--cream)}
.fhr .fhc__btn svg{display:block;flex:none}
.fhr .fhc__pause{margin-right:6px}
.fhr .fhc__btn .fhc__i-play,.fhr .fhc.is-paused .fhc__btn .fhc__i-pause{display:none}
.fhr .fhc.is-paused .fhc__btn .fhc__i-play{display:block}
@media (max-width:999px){.fhr .fhc{--per:3}}
@media (max-width:640px){.fhr .fhc{--per:2;--gap:8px}.fhr .fhc__ctrl{margin-top:16px}.fhr .fhc__btn{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){.fhr .fhc__item img{transition:none}}
</style>

<script>
/* Life at The Shoes – shuffles the photos, then moves along one at a time */
(function () {
  function setup(root) {
    var view = root.querySelector('.fhc__view'), track = root.querySelector('.fhc__track');
    if (!view || !track || track.children.length < 2) return;
    var items = Array.prototype.slice.call(track.children), i, j, t;
    for (i = items.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = items[i]; items[i] = items[j]; items[j] = t; }
    items.forEach(function (li) { track.appendChild(li); });
    root.classList.add('fhc--js');
    view.scrollLeft = 0;

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DUR = reduce ? 0 : 900;
    var wait = Math.max(1500, parseInt(root.getAttribute('data-interval'), 10) || 3500);
    var busy = false, timer = null, userPaused = !!reduce, inView = !('IntersectionObserver' in window), focusIn = false;
    var pauseBtn = root.querySelector('.fhc__pause');

    function per() { return parseInt(getComputedStyle(root).getPropertyValue('--per'), 10) || 5; }
    function step() { var k = track.children; return k[1].offsetLeft - k[0].offsetLeft; }
    function eager(li) { var im = li && li.querySelector('img'); if (im && im.loading === 'lazy') im.loading = 'eager'; }
    function mark() {
      var n = per();
      Array.prototype.forEach.call(track.children, function (li, k) {
        var a = li.querySelector('a');
        if (k < n) li.removeAttribute('aria-hidden'); else li.setAttribute('aria-hidden', 'true');
        if (a) a.tabIndex = k < n ? 0 : -1;
        if (k < n + 2) eager(li);
      });
      eager(track.lastElementChild);
    }
    function setX(x, anim) {
      track.style.transition = anim && DUR ? 'transform ' + DUR + 'ms cubic-bezier(.45,.05,.25,1)' : 'none';
      track.style.transform = x ? 'translate3d(' + x + 'px,0,0)' : '';
    }
    function after(fn) {
      var over = false;
      function fin() {
        if (over) return;
        over = true;
        track.removeEventListener('transitionend', onEnd);
        fn(); busy = false; mark();
      }
      function onEnd(e) { if (e.target === track) fin(); }
      if (!DUR) { fin(); return; }
      track.addEventListener('transitionend', onEnd);
      setTimeout(fin, DUR + 200);
    }
    function move(dir) {
      if (busy) return;
      busy = true;
      var s = step();
      if (dir > 0) {
        eager(track.children[per()]);
        setX(-s, true);
        after(function () { track.appendChild(track.firstElementChild); setX(0, false); });
      } else {
        track.insertBefore(track.lastElementChild, track.firstElementChild);
        setX(-s, false);
        void track.offsetWidth;
        setX(0, true);
        after(function () {});
      }
    }
    function playing() { return !userPaused && inView && !focusIn && !document.hidden; }
    function schedule() {
      clearTimeout(timer);
      if (playing()) timer = setTimeout(function () { move(1); schedule(); }, wait);
    }
    function setPaused(p) {
      userPaused = p;
      root.classList.toggle('is-paused', p);
      if (pauseBtn) pauseBtn.setAttribute('aria-label', p ? 'Play the photos' : 'Pause the photos');
      schedule();
    }

    if (pauseBtn) pauseBtn.addEventListener('click', function () { setPaused(!userPaused); });
    var nb = root.querySelector('.fhc__next'), pb = root.querySelector('.fhc__prev');
    if (nb) nb.addEventListener('click', function () { move(1); schedule(); });
    if (pb) pb.addEventListener('click', function () { move(-1); schedule(); });
    track.addEventListener('focusin', function () { focusIn = true; schedule(); });
    track.addEventListener('focusout', function () { focusIn = false; schedule(); });
    document.addEventListener('visibilitychange', schedule);

    var sx = null, sy = 0, swiped = false;
    view.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    view.addEventListener('touchend', function (e) {
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        move(dx < 0 ? 1 : -1); schedule();
        swiped = true; setTimeout(function () { swiped = false; }, 450);
      }
    }, { passive: true });
    track.addEventListener('click', function (e) { if (swiped) { e.preventDefault(); e.stopPropagation(); } }, true);

    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(mark, 150); });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (en) { inView = en[0].isIntersecting; schedule(); }, { threshold: 0.3 }).observe(root);
    }
    setPaused(userPaused);
    mark();
  }

})();
