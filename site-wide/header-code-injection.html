#header .header-title-logo img{display:none !important}

/* menu links: one line, small spaced capitals, like the home page */
#header .header-nav-list{display:flex !important;flex-wrap:nowrap !important;align-items:center;gap:6px 28px}
#header .header-nav-item{margin:0 !important;padding:0 !important}
#header .header-nav-item>a,#header .header-nav-folder-title{font-family:'Jost','Gill Sans','Trebuchet MS',sans-serif !important;font-size:13px !important;font-weight:500 !important;letter-spacing:.16em !important;text-transform:uppercase !important;line-height:1.2 !important;color:#1E262E !important;padding:8px 0 !important;background-image:none !important;white-space:nowrap}
#header .header-nav-item>a:hover,#header .header-nav-folder-title:hover{color:#7A5B1E !important;opacity:1 !important}
#header .header-nav-item--active>a{box-shadow:inset 0 -1px 0 #7A5B1E}
/* "Book A Table" becomes a solid button */
#header .header-nav-item>a[href="/book"]{background:#1E262E !important;color:#FBF8EF !important;padding:14px 22px !important;border-radius:2px;box-shadow:none}
#header .header-nav-item>a[href="/book"]:hover{background:#2E3A44 !important;color:#FBF8EF !important}
/* the Food & Drink drop-down */
#header .header-nav-folder-content{background:#FFFDF7 !important;border:1px solid #E6DCC3;border-radius:3px;box-shadow:0 16px 34px rgba(30,38,46,.14);padding:10px 0 !important;min-width:220px}
#header .header-nav-folder-item{margin:0 !important;padding:0 !important}
#header .header-nav-folder-item a{display:block;font-family:'Jost','Gill Sans','Trebuchet MS',sans-serif !important;font-size:14.5px !important;letter-spacing:.03em !important;text-transform:none !important;color:#1E262E !important;padding:9px 22px !important;background-image:none !important}
#header .header-nav-folder-item a:hover{background:#F3ECDB !important;color:#7A5B1E !important}

/* logo on the left, menu pushed over to the right */
#header .header-display-desktop .header-title-nav-wrapper{flex:1 1 auto !important;justify-content:space-between !important}
#header .header-display-desktop .header-title{flex:0 0 auto !important;width:auto !important;max-width:none !important}
#header .header-display-desktop .header-title-logo{display:block !important;width:auto !important}
#header .header-display-desktop .header-nav{flex:0 1 auto !important;width:auto !important;max-width:none !important;margin-left:auto !important;padding-left:32px !important}
#header .header-display-desktop .header-actions{flex:0 0 auto !important;width:auto !important;min-width:0 !important}

/* phones and tablets: burger + full-screen menu */
#header .burger-inner>div{background-color:#1E262E !important}
.header-menu .header-menu-bg{background:#FBF8EF !important}
.header-menu .header-menu-nav-item a{font-family:'Cormorant Garamond',Georgia,serif !important;font-size:32px !important;font-weight:600 !important;letter-spacing:0 !important;text-transform:none !important;color:#1E262E !important;line-height:1.25 !important}
.header-menu .header-menu-nav-item a:hover{color:#7A5B1E !important}
.header-menu .header-menu-controls-control{font-family:'Jost',sans-serif !important;font-size:13px !important;letter-spacing:.16em !important;text-transform:uppercase !important}
.header-menu .header-menu-nav-item a[href="/book"]{display:inline-block !important;margin-top:14px;padding:16px 28px !important;background:#1E262E;color:#FBF8EF !important;font-family:'Jost',sans-serif !important;font-size:14px !important;font-weight:500 !important;letter-spacing:.16em !important;text-transform:uppercase !important;border-radius:2px}
/* under 1100px wide the whole menu won't fit on one line, so use the menu button */
@media (max-width:1099px){
  #header .header-display-desktop{display:none !important}
  #header .header-display-mobile{display:flex !important}
  #header .header-display-mobile .header-nav{display:none !important}
  #header .header-display-mobile .header-burger{display:flex !important}
  .header--menu-open .header-menu{opacity:1 !important;visibility:visible !important}
}
@media (max-width:767px){
  #header .header-title-logo a{width:220px}
  #header .header-inner{padding-top:12px !important;padding-bottom:12px !important}
}
@media (min-width:768px) and (max-width:1260px){
  #header .header-nav-list{gap:6px 18px}
  #header .header-nav-item>a,#header .header-nav-folder-title{font-size:12px !important;letter-spacing:.12em !important}
  #header .header-title-logo a{width:220px}
}
</style>
<script>
/* keeps the space above the first section the same height as the header
   (on load, once the fonts arrive, and when the screen is resized) */
(function () {
  function set() {
    var h = document.getElementById('header');
    if (h) document.documentElement.style.setProperty('--header-height', h.getBoundingClientRect().height + 'px');
  }
  set();
  document.addEventListener('DOMContentLoaded', set);
  window.addEventListener('load', set);
  window.addEventListener('resize', set);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(set);
})();
</script>
